<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/services.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <title>Ремонт обеспылевающего оборудования</title>
  </head>
  <body>
    <header class="header__services">
      <div class="container">
        <div class="header__wrapper header__wrapper-service">
          <div class="header__top header__top-services">
            <a href="/index.html" class="logo">
              <img src="../images/logo.png" alt="logo" />
            </a>
            <nav class="menu">
              <ul class="menu__list">
                <li class="menu__item">
                  <a
                    href="#about"
                    class="menu__link hover-btn"
                    data-text="О компании"
                    ><span>О кампании</span></a
                  >
                </li>
                <li class="menu__item">
                  <a
                    href="#services"
                    class="menu__link hover-btn"
                    data-text="Наши услуги"
                    ><span>Наши услуги</span></a
                  >
                </li>
                <li class="menu__item">
                  <a
                    href="#career"
                    class="menu__link hover-btn"
                    data-text="Карьера"
                    ><span>Карьера</span></a
                  >
                </li>
                <li class="menu__item">
                  <a
                    href="#news"
                    class="menu__link hover-btn"
                    data-text="Новости / события"
                    ><span>Новости / события</span></a
                  >
                </li>
                <li class="menu__item">
                  <a
                    href="#footer"
                    class="menu__link hover-btn"
                    data-text="Контакты"
                    ><span>Контакты</span></a
                  >
                </li>
              </ul>
            </nav>
          </div>
          <div class="header__hero-services">
            <p class="highlight-desc header__services-desc">Наши услуги</p>
            <h1 class="header__title-services">
              Ремонт обеспылевающего оборудования
            </h1>
            <h5 class="header__subtitle">
              Экологическая безопасность производства и защита окружающей среды
            </h5>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="service__gallery">
        <div class="container">
          <div class="gallery__carousel">
            <div class="gallery__slide">
              <img src="../images/services/slider/1/1new.jpg" alt="" />
            </div>

            <div class="gallery__slide">
              <img src="../images/services/slider/1/2.jpg" alt="" />
            </div>

            <div class="gallery__slide">
              <img src="../images/services/slider/1/3.jpg" alt="" />
            </div>

            <div class="gallery__slide">
              <img src="../images/services/slider/1/4.jpg" alt="" />
            </div>

            <div class="gallery__slide">
              <img src="../images/services/slider/1/5.jpg" alt="" />
            </div>

            <div class="gallery__slide">
              <img src="../images/services/slider/1/6.jpg" alt="" />
            </div>

            <div class="gallery__slide">
              <img src="../images/services/slider/1/7.jpg" alt="" />
            </div>

            <div class="gallery__slide">
              <img src="../images/services/slider/1/8.jpg" alt="" />
            </div>

            <div class="gallery__slide">
              <img src="../images/services/slider/1/9.jpg" alt="" />
            </div>

            <div class="gallery__slide">
              <img src="../images/services/slider/1/10.jpg" alt="" />
            </div>
          </div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  </body>
</html>
