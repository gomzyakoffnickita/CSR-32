<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <title>О нас</title>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="header__wrapper-about">
          <div class="header__top">
            <a href="#" class="logo">
              <img src="" alt="logo" />
            </a>
            <nav class="menu">
              <ul class="menu__list">
                <li class="menu__item">
                  <a
                    href="#about"
                    class="menu__link hover-btn"
                    data-text="О компании"
                    ><span>О кампании</span></a
                  >
                </li>
                <li class="menu__item">
                  <a
                    href="#services"
                    class="menu__link hover-btn"
                    data-text="Наши услуги"
                    ><span>Наши услуги</span></a
                  >
                </li>
                <li class="menu__item">
                  <a
                    href="#career"
                    class="menu__link hover-btn"
                    data-text="Карьера"
                    ><span>Карьера</span></a
                  >
                </li>
                <li class="menu__item">
                  <a
                    href="#news"
                    class="menu__link hover-btn"
                    data-text="Новости / события"
                    ><span>Новости / события</span></a
                  >
                </li>
                <li class="menu__item">
                  <a
                    href="#footer"
                    class="menu__link hover-btn"
                    data-text="Контакты"
                    ><span>Контакты</span></a
                  >
                </li>
              </ul>
            </nav>
          </div>
          <div class="header__hero-about">
            <h1>О нашей кампании</h1>
            <p class="about__team-desc">Наша команда</p>
            <div class="about__team-preview">
              <div class="about__team-photo">
                <!-- <img src="/images/about/1.jpeg" alt="" />
                <img src="/images/about/2.jpeg" alt="" /> -->
              </div>
              <a href="" class="about__team-link">Узнать больше</a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/ScrollTrigger.min.js"></script>
    <script src="../main.js" defer></script>
  </body>
</html>
